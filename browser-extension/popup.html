<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: dark; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { box-sizing: border-box; width: 275px; margin: 0; padding: 20px; color: #eaf0e7; background: #131815; }
      .label { font-size: 11px; letter-spacing: .11em; font-weight: 750; color: #9da999; }
      h1 { font-size: 20px; margin: 12px 0 6px; letter-spacing: -.02em; }
      p { color: #a5b4a3; line-height: 1.55; }
      #status { color: #d3f692; }
      button { margin-top: 9px; color: #202b1e; background: #c9f575; border: 0; border-radius: 8px; padding: 9px 12px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="label">FOCUS BLOCKER</div>
    <h1 id="status">Checking...</h1>
    <p id="description">Your blocked websites are managed from Raycast.</p>
    <button id="sync">Sync Now</button>
    <script src="popup.js"></script>
  </body>
</html>
