<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stay focused</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main>
      <div class="glyph" aria-hidden="true">✳</div>
      <span class="eyebrow">FOCUS BLOCKER</span>
      <h1>Back to what matters.</h1>
      <p>This page is on your blocklist. Your other tabs and websites are still available.</p>
      <div class="actions">
        <button type="button" id="close">Close this tab</button>
        <button type="button" id="back" class="secondary">Go back</button>
      </div>
      <div class="hint">Need access? Search <strong>Toggle Website Blocking</strong> in Raycast.</div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
